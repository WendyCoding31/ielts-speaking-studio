name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check groups.js
          node --check data.js
      - name: Validate question-bank data
        run: node scripts/validate-data.js
      - name: Check Python syntax
        run: python -m py_compile server.py
      - name: Check launcher syntax
        run: |
          bash -n start-macos.command
          bash -n start-lan-macos.command
          sh -n start-linux.sh
